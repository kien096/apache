<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#EEF6FF"/>
      <stop offset="1" stop-color="#F7FBF3"/>
    </linearGradient>
    <linearGradient id="hdfs" x1="220" y1="240" x2="655" y2="685" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCEBFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <linearGradient id="yarn" x1="720" y1="240" x2="1145" y2="685" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E1F7E8"/>
      <stop offset="1" stop-color="#F0FBF2"/>
    </linearGradient>
    <linearGradient id="dashboard" x1="1210" y1="245" x2="1478" y2="685" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF2CE"/>
      <stop offset="1" stop-color="#FFF9E8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B2545" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L16 9L2 16V2Z" fill="#2E74B5"/>
    </marker>
    <style>
      .title { font: 700 44px Calibri, Arial, sans-serif; fill: #0B2545; }
      .subtitle { font: 400 22px Calibri, Arial, sans-serif; fill: #475467; }
      .section { font: 700 28px Calibri, Arial, sans-serif; fill: #0B2545; }
      .node-title { font: 700 22px Calibri, Arial, sans-serif; fill: #101828; }
      .node-text { font: 400 17px Calibri, Arial, sans-serif; fill: #475467; }
      .small { font: 400 15px Calibri, Arial, sans-serif; fill: #667085; }
      .tag { font: 700 15px Calibri, Arial, sans-serif; fill: #1F4D78; }
      .label { font: 700 16px Calibri, Arial, sans-serif; fill: #2E74B5; }
      .box { stroke: #D0D5DD; stroke-width: 2; filter: url(#shadow); }
      .inner { fill: white; stroke: #D0D5DD; stroke-width: 1.5; }
      .arrow { stroke: #2E74B5; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
      .dash { stroke: #98A2B3; stroke-width: 3; stroke-dasharray: 9 8; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1480" cy="110" r="190" fill="#DBEAFE" opacity="0.45"/>
  <circle cx="115" cy="825" r="240" fill="#DCFCE7" opacity="0.35"/>

  <text x="80" y="82" class="title">Sơ Đồ Kiến Trúc Hệ Thống BT01</text>
  <text x="82" y="121" class="subtitle">Phân tích log web quy mô lớn với HDFS, MapReduce, YARN, Python Streaming, PostgreSQL và Grafana</text>

  <rect x="82" y="160" width="260" height="112" rx="24" class="box" fill="#FFFFFF"/>
  <text x="126" y="201" class="node-title">Log Generator</text>
  <text x="126" y="229" class="node-text">Python sinh 2.000.000 dòng</text>
  <text x="126" y="253" class="small">Apache Combined Log Format</text>
  <path d="M120 226H98C91.3726 226 86 220.627 86 214V200C86 193.373 91.3726 188 98 188H114C120.627 188 126 193.373 126 200V204" stroke="#2E74B5" stroke-width="4" stroke-linecap="round"/>
  <path d="M104 209H132L120 197" stroke="#2E74B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="220" y="315" width="435" height="370" rx="32" class="box" fill="url(#hdfs)"/>
  <text x="252" y="364" class="section">HDFS - Lưu trữ phân tán</text>
  <text x="252" y="395" class="node-text">Tổ chức log theo thư mục ngày: /logs/yyyy/MM/dd/</text>

  <rect x="260" y="430" width="160" height="90" rx="18" class="inner"/>
  <text x="286" y="465" class="node-title">NameNode</text>
  <text x="286" y="494" class="small">Metadata</text>

  <rect x="460" y="430" width="155" height="90" rx="18" class="inner"/>
  <text x="487" y="465" class="node-title">DataNode 1</text>
  <text x="492" y="494" class="small">Block dữ liệu</text>

  <rect x="460" y="555" width="155" height="90" rx="18" class="inner"/>
  <text x="487" y="590" class="node-title">DataNode 2</text>
  <text x="492" y="619" class="small">Block dữ liệu</text>

  <rect x="260" y="555" width="160" height="90" rx="18" class="inner"/>
  <text x="288" y="590" class="node-title">Raw Logs</text>
  <text x="286" y="619" class="small">access.log</text>

  <path d="M342 272C342 298 342 298 342 315" class="arrow"/>
  <text x="372" y="304" class="label">01. Nạp log lên HDFS</text>

  <rect x="720" y="315" width="425" height="370" rx="32" class="box" fill="url(#yarn)"/>
  <text x="752" y="364" class="section">YARN + MapReduce</text>
  <text x="752" y="395" class="node-text">Hadoop Streaming chạy mapper/reducer Python</text>

  <rect x="760" y="430" width="170" height="90" rx="18" class="inner"/>
  <text x="784" y="465" class="node-title">Resource</text>
  <text x="788" y="491" class="node-title">Manager</text>

  <rect x="960" y="430" width="145" height="90" rx="18" class="inner"/>
  <text x="984" y="465" class="node-title">Mapper</text>
  <text x="981" y="494" class="small">parse / emit</text>

  <rect x="760" y="555" width="170" height="90" rx="18" class="inner"/>
  <text x="784" y="590" class="node-title">NodeManager</text>
  <text x="806" y="619" class="small">task container</text>

  <rect x="960" y="555" width="145" height="90" rx="18" class="inner"/>
  <text x="986" y="590" class="node-title">Reducer</text>
  <text x="983" y="619" class="small">sum / top-N</text>

  <path d="M655 500H720" class="arrow"/>
  <text x="630" y="470" class="label">02. Đọc input</text>

  <rect x="775" y="735" width="330" height="112" rx="24" class="box" fill="#FFFFFF"/>
  <text x="810" y="778" class="node-title">HDFS Output</text>
  <text x="810" y="807" class="node-text">/bt01/output/normalized</text>
  <text x="810" y="831" class="node-text">/bt01/output/top_ips, status, URL, hour</text>
  <path d="M930 685V735" class="arrow"/>
  <text x="958" y="719" class="label">03. Ghi kết quả</text>

  <rect x="1210" y="315" width="268" height="370" rx="32" class="box" fill="url(#dashboard)"/>
  <text x="1242" y="364" class="section">Dashboard</text>
  <text x="1242" y="395" class="node-text">Trực quan hóa tương tác</text>

  <rect x="1248" y="435" width="192" height="86" rx="18" class="inner"/>
  <text x="1276" y="470" class="node-title">PostgreSQL</text>
  <text x="1282" y="498" class="small">Load TSV export</text>

  <rect x="1248" y="560" width="192" height="86" rx="18" class="inner"/>
  <text x="1292" y="596" class="node-title">Grafana</text>
  <text x="1280" y="624" class="small">Filter theo ngày/giờ</text>

  <path d="M1105 790C1200 790 1225 520 1248 485" class="arrow"/>
  <text x="1128" y="755" class="label">04. Export TSV & load DB</text>

  <path d="M1344 521V560" class="arrow"/>
  <text x="1362" y="546" class="label">05. Query</text>

  <rect x="80" y="780" width="585" height="118" rx="26" class="box" fill="#FFFFFF"/>
  <text x="118" y="824" class="node-title">Các chương trình phân tích chính</text>
  <text x="118" y="858" class="node-text">1. Top 20 IP truy cập nhiều nhất · 2. Mã HTTP theo ngày</text>
  <text x="118" y="884" class="node-text">3. Top 10 URL mỗi ngày · 4. Lưu lượng theo 24 giờ</text>

  <path d="M1210 190H1478V265" class="dash"/>
  <rect x="1184" y="145" width="322" height="72" rx="18" fill="#FFFFFF" stroke="#D0D5DD" stroke-width="2"/>
  <text x="1212" y="175" class="tag">Web UI theo dõi</text>
  <text x="1212" y="199" class="small">HDFS UI: localhost:9871 · YARN UI: localhost:8089</text>

  <rect x="80" y="918" width="1420" height="2" fill="#D0D5DD"/>
  <text x="80" y="950" class="small">Ảnh 1 - Sơ đồ kiến trúc hệ thống BT01. File SVG có thể chèn trực tiếp vào Word hoặc import vào Figma.</text>
</svg>
